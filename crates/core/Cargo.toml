[package]
name = "steam-auth"
version = "0.1.0"
edition = "2021"
description = "High-performance, native Steam authentication and session management library in Rust"
license = "MIT OR Apache-2.0"
authors = ["Google Antigravity & Pair Programmer"]
readme = "README.md"

[dependencies]
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1.40", features = ["rt", "macros", "time", "sync"] }
rsa = { version = "0.9", features = ["sha1"] }
rand = "0.8"
num-bigint = "0.4"
hex = "0.4"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
url = "2.5"
qrcode = { version = "0.14", default-features = false }
keyring = "4.2.0"

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
prost-build = "0.13"
