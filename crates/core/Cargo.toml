[package]
name = "steam-core"
version = "0.1.0"
edition = "2021"
description = "Native Rust core for Steam authentication and session management"
license = "MIT OR Apache-2.0"
readme = "../../README.md"

[features]
default = []
keyring-store = ["dep:keyring"]

[dependencies]
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
tokio = { version = "1.40", features = ["rt", "macros", "time", "sync"] }
rsa = { version = "0.9", features = ["sha1"] }
rand = "0.8"
num-bigint = "0.4"
hex = "0.4"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
url = "2.5"
qrcode = { version = "0.14", default-features = false }
keyring = { version = "4.2.0", optional = true }

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
